<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved coordinates</title>
  </head>
  <body>
    <pre id="out">loading…</pre>
    <script>
      var STORE =
        "https://crudcrud.com/api/0c5e751c477a4f45a8cca37c3c13ea1d/locations";

      function rowsFrom(list) {
        return (list || []).filter(function (row) {
          return row && row.lat != null && row.lng != null;
        }).map(function (row) {
          return {
            lat: row.lat,
            lng: row.lng,
            accuracy: row.accuracy,
            time: row.time,
            local_time: row.local_time,
          };
        });
      }

      function keyOf(row) {
        return [row.lat, row.lng, row.time, row.local_time].join("|");
      }

      function merge(a, b) {
        var seen = {};
        var out = [];
        a.concat(b).forEach(function (row) {
          var key = keyOf(row);
          if (seen[key]) return;
          seen[key] = true;
          out.push(row);
        });
        out.sort(function (x, y) {
          return String(y.time || "").localeCompare(String(x.time || ""));
        });
        return out;
      }

      function fetchJson(url) {
        return fetch(url, { cache: "no-store" }).then(function (res) {
          return res.ok ? res.json() : [];
        }).catch(function () {
          return [];
        });
      }

      var remoteLoads = 0;

      function load(fromRemote) {
        var remote = Promise.resolve([]);
        if (fromRemote && remoteLoads < 20) {
          remoteLoads += 1;
          remote = fetchJson(STORE + "?t=" + Date.now());
        }
        Promise.all([remote, fetchJson("locations.json?t=" + Date.now())]).then(
          function (parts) {
            var rows = merge(rowsFrom(parts[0]), rowsFrom(parts[1]));
            document.getElementById("out").textContent = rows.length
              ? JSON.stringify(rows, null, 2)
              : "No coordinates saved yet.";
          }
        );
      }

      load(true);
      setInterval(function () {
        load(true);
      }, 15000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) load(true);
      });
    </script>
  </body>
</html>
