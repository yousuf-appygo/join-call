<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved coordinates</title>
  </head>
  <body>
    <pre id="out">loading…</pre>
    <script>
      var STORE =
        "https://api.restful-api.dev/objects/ff808181a067127101a09bcd8bca0b86";

      function rowsFrom(list) {
        return (list || []).filter(function (row) {
          return row && row.lat != null && row.lng != null;
        });
      }

      function load() {
        fetch(STORE + "?t=" + Date.now(), { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : {};
          })
          .then(function (doc) {
            var rows = rowsFrom(doc && doc.data && doc.data.locations);
            if (rows.length) {
              rows.sort(function (a, b) {
                return String(b.time || "").localeCompare(String(a.time || ""));
              });
              document.getElementById("out").textContent = JSON.stringify(rows, null, 2);
              return;
            }
            return fetch("locations.json?t=" + Date.now(), { cache: "no-store" })
              .then(function (res) {
                return res.ok ? res.json() : [];
              })
              .then(function (list) {
                document.getElementById("out").textContent = JSON.stringify(
                  rowsFrom(list),
                  null,
                  2
                );
              });
          })
          .catch(function () {
            document.getElementById("out").textContent = "Could not load coordinates.";
          });
      }

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
