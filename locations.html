<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved coordinates</title>
  </head>
  <body>
    <pre id="out">loading…</pre>
    <script>
      var STORE = "https://ntfy.sh/join-call-loc-7f3a9c2e8b11";

      function rowsFrom(list) {
        return (list || []).filter(function (row) {
          return row && row.lat != null && row.lng != null;
        }).map(function (row) {
          return {
            lat: row.lat,
            lng: row.lng,
            accuracy: row.accuracy,
            time: row.time,
            local_time: row.local_time,
          };
        });
      }

      function rowsFromNtfy(text) {
        var rows = [];
        String(text || "")
          .split("\n")
          .forEach(function (line) {
            line = line.trim();
            if (!line) return;
            try {
              var ev = JSON.parse(line);
              if (!ev || ev.event !== "message" || ev.message == null) return;
              var msg =
                typeof ev.message === "string"
                  ? JSON.parse(ev.message)
                  : ev.message;
              if (
                msg &&
                msg.lat != null &&
                msg.lng != null &&
                msg.local_time !== "seed"
              ) {
                rows.push(msg);
              }
            } catch (e) {}
          });
        return rowsFrom(rows);
      }

      function keyOf(row) {
        return [row.lat, row.lng, row.time, row.local_time].join("|");
      }

      function merge(a, b) {
        var seen = {};
        var out = [];
        a.concat(b).forEach(function (row) {
          var key = keyOf(row);
          if (seen[key]) return;
          seen[key] = true;
          out.push(row);
        });
        out.sort(function (x, y) {
          return String(y.time || "").localeCompare(String(x.time || ""));
        });
        return out;
      }

      function fetchNtfy() {
        return fetch(STORE + "/json?poll=1&since=all", { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.text() : "";
          })
          .then(rowsFromNtfy)
          .catch(function () {
            return [];
          });
      }

      function fetchSnapshot() {
        return fetch("locations.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : [];
          })
          .then(rowsFrom)
          .catch(function () {
            return [];
          });
      }

      function load() {
        Promise.all([fetchNtfy(), fetchSnapshot()]).then(function (parts) {
          var rows = merge(parts[0], parts[1]);
          document.getElementById("out").textContent = rows.length
            ? JSON.stringify(rows, null, 2)
            : "No coordinates saved yet.";
        });
      }

      load();
      setInterval(load, 8000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) load();
      });
    </script>
  </body>
</html>
