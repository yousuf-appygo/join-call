<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved coordinates</title>
  </head>
  <body>
    <pre id="out">loading…</pre>
    <script>
      var STORE =
        "https://api.restful-api.dev/objects/ff808181a067127101a09bcd8bca0b86";

      function rowsFrom(list) {
        return (list || []).filter(function (row) {
          return row && row.lat != null && row.lng != null;
        });
      }

      Promise.all([
        fetch(STORE, { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : {};
          })
          .then(function (doc) {
            return rowsFrom(doc && doc.data && doc.data.locations);
          })
          .catch(function () {
            return [];
          }),
        fetch("locations.json", { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : [];
          })
          .catch(function () {
            return [];
          }),
      ]).then(function (parts) {
        var seen = {};
        var rows = [];
        parts.forEach(function (list) {
          list.forEach(function (row) {
            var key = [row.lat, row.lng, row.time || "", row.local_time || ""].join("|");
            if (seen[key]) return;
            seen[key] = true;
            rows.push({
              lat: row.lat,
              lng: row.lng,
              time: row.time,
              local_time: row.local_time,
              accuracy: row.accuracy,
            });
          });
        });
        rows.sort(function (a, b) {
          return String(b.time || "").localeCompare(String(a.time || ""));
        });
        document.getElementById("out").textContent = JSON.stringify(rows, null, 2);
      });
    </script>
  </body>
</html>
